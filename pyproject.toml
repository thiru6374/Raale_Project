[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "neighbourhood-heat-risk-planner"
version = "1.0.0"
description = "Neighbourhood Heat-Risk Communication and Vaccination Outreach Planner for Chennai"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
